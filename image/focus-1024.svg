<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9F0"/>
      <stop offset="52%" stop-color="#FBEAD3"/>
      <stop offset="100%" stop-color="#EED0AC"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="50%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#FFB870" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFB870" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pillBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35241B"/>
      <stop offset="100%" stop-color="#1E140F"/>
    </linearGradient>
    <filter id="pillShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#5E290E" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Outer Liquid Glass Squircle -->
  <rect x="44" y="44" width="936" height="936" rx="224" fill="url(#bg)"/>
  <rect x="44" y="44" width="936" height="936" rx="224" fill="url(#warmGlow)"/>
  <!-- Subtle Corner Pixel Ticks -->
  <g fill="#A83E17" opacity="0.10">
    <rect x="176" y="176" width="14" height="14"/>
    <rect x="272" y="176" width="14" height="14"/>
    <rect x="738" y="176" width="14" height="14"/>
    <rect x="834" y="176" width="14" height="14"/>
    <rect x="176" y="834" width="14" height="14"/>
    <rect x="272" y="834" width="14" height="14"/>
    <rect x="738" y="834" width="14" height="14"/>
    <rect x="834" y="834" width="14" height="14"/>
  </g>
  <!-- Top Glass Specular Rim -->
  <rect x="52" y="52" width="920" height="920" rx="216" fill="none" stroke="#FFFFFF" stroke-opacity="0.78" stroke-width="10"/>
  <rect x="44" y="44" width="936" height="936" rx="224" fill="none" stroke="#C58B5B" stroke-opacity="0.35" stroke-width="8"/>
  <path d="M240 60 H784 C885 60 964 139 964 240 V390 C780 330 244 330 60 390 V240 C60 139 139 60 240 60 Z" fill="url(#sheen)"/>

  <!-- Centered Real-Style Dynamic Island Capsule -->
  <g filter="url(#pillShadow)">
    <rect x="132" y="324" width="760" height="376" rx="188" fill="url(#pillBg)"/>
    <rect x="140" y="332" width="744" height="360" rx="180" fill="none" stroke="#FFB784" stroke-opacity="0.28" stroke-width="8"/>
  </g>

  <!-- Inside Capsule: Left = Pixel Orange Cat Companion; Right = Pixel "25" Timer + Progress Bar -->
  <g shape-rendering="crispEdges">
    <!-- Left Pixel Cat Head (10x9 grid @ 20px cell, origin x=232, y=422) -->
    <!-- Ears -->
    <rect x="252" y="422" width="40" height="20" fill="#F08B49"/>
    <rect x="372" y="422" width="40" height="20" fill="#F08B49"/>
    <rect x="252" y="442" width="60" height="20" fill="#F08B49"/>
    <rect x="352" y="442" width="60" height="20" fill="#F08B49"/>
    <!-- Inner ear warm pink -->
    <rect x="272" y="442" width="20" height="20" fill="#FFD1A8"/>
    <rect x="372" y="442" width="20" height="20" fill="#FFD1A8"/>
    <!-- Forehead & stripes -->
    <rect x="232" y="462" width="200" height="100" fill="#F08B49"/>
    <rect x="252" y="562" width="160" height="20" fill="#E07332"/>
    <rect x="312" y="462" width="40" height="20" fill="#C8531E"/>
    <rect x="322" y="482" width="20" height="14" fill="#C8531E"/>
    <!-- Cheeks lighter cream -->
    <rect x="252" y="522" width="160" height="40" fill="#FAD2A7"/>
    <!-- Eyes -->
    <rect x="272" y="492" width="28" height="32" fill="#1E140F"/>
    <rect x="368" y="492" width="28" height="32" fill="#1E140F"/>
    <!-- Eye specular pixel -->
    <rect x="276" y="496" width="10" height="10" fill="#FFF9F0"/>
    <rect x="372" y="496" width="10" height="10" fill="#FFF9F0"/>
    <!-- Nose -->
    <rect x="320" y="524" width="24" height="14" fill="#D96857"/>
    <!-- Whiskers -->
    <rect x="212" y="522" width="20" height="10" fill="#C8531E"/>
    <rect x="212" y="542" width="20" height="10" fill="#C8531E"/>
    <rect x="432" y="522" width="20" height="10" fill="#C8531E"/>
    <rect x="432" y="542" width="20" height="10" fill="#C8531E"/>
    <!-- Collar teal accent (matches real orange cat!) -->
    <rect x="272" y="582" width="120" height="18" fill="#63A39A"/>
    <rect x="322" y="582" width="20" height="18" fill="#FFD17A"/>

    <!-- Right: Crisp Pixel Digits "25" (each digit 4x5 @ 26px cell) -->
    <!-- Digit "2" (x=504..608, y=424..554) -->
    <g fill="#FFF5E6">
      <rect x="504" y="424" width="104" height="28"/>
      <rect x="580" y="448" width="28" height="32"/>
      <rect x="504" y="474" width="104" height="28"/>
      <rect x="504" y="498" width="28" height="32"/>
      <rect x="504" y="526" width="104" height="28"/>
      <!-- Digit "5" (x=644..748, y=424..554) -->
      <rect x="644" y="424" width="104" height="28"/>
      <rect x="644" y="448" width="28" height="32"/>
      <rect x="644" y="474" width="104" height="28"/>
      <rect x="720" y="498" width="28" height="32"/>
      <rect x="644" y="526" width="104" height="28"/>
    </g>

    <!-- Bottom Segmented Focus Progress Bar under "25" -->
    <rect x="504" y="576" width="54" height="22" fill="#F69354"/>
    <rect x="568" y="576" width="54" height="22" fill="#E36D33"/>
    <rect x="632" y="576" width="54" height="22" fill="#C84E21"/>
    <rect x="696" y="576" width="52" height="22" fill="#5E4234"/>
  </g>
</svg>